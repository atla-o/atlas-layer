name: assemble-lock
on:
  push:
    paths:
      - "src-tauri/Cargo.lock.part-02"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the full lockfile
        run: |
          cat src-tauri/Cargo.lock.part-00 src-tauri/Cargo.lock.part-01 src-tauri/Cargo.lock.part-02 > src-tauri/Cargo.lock
          test "$(wc -c < src-tauri/Cargo.lock)" = 126704
          rm -f src-tauri/Cargo.lock.part-00 src-tauri/Cargo.lock.part-01 src-tauri/Cargo.lock.part-02
          rm -f .github/workflows/assemble-lock.yml
          git config user.email "account@atla-o.com"
          git config user.name "atla-o"
          git add -A
          git commit -m "Add the full Cargo.lock"
          git push
